version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: opentrace-postgres
    environment:
      POSTGRES_DB: opentrace
      POSTGRES_USER: opentrace
      POSTGRES_PASSWORD: opentracesecurepassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: opentrace-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/deployment/Dockerfile.api
    container_name: opentrace-api
    environment:
      DATABASE_URL: postgresql+asyncpg://opentrace:opentracesecurepassword@postgres:5432/opentrace
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/deployment/Dockerfile.web
    container_name: opentrace-web
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

